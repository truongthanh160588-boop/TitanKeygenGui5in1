<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý AI giọng nói</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d8bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trợ lý AI">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #eaf4ff 0%, #cfe6ff 45%, #1d8bff 100%);
    color: #0a2a6b;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 480px; height: 100dvh;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; top: -60px; left: 50%; width: 460px; height: 460px; margin-left: -230px;
    background: radial-gradient(circle, #5db4ff 0%, rgba(93,180,255,0) 70%);
    pointer-events: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 0; z-index: 1; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
  .status { font-size: .8rem; color: #2f5fb3; margin-top: 2px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.75); color: #1d6fd8; font-size: 1.1rem;
    box-shadow: 0 4px 14px rgba(29,139,255,.25);
  }
  .icon-btn.off { opacity: .5; }
  .stage { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; z-index: 1; margin-top: 4px; }
  .robot { width: 190px; height: 190px; animation: float 3.2s ease-in-out infinite; filter: drop-shadow(0 14px 18px rgba(10,60,160,.3)); }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .eye { fill: none; stroke: #6ff3ff; stroke-width: 5; stroke-linecap: round; transition: all .2s; }
  .mouth { fill: none; stroke: #6ff3ff; stroke-width: 4; stroke-linecap: round; transform-origin: 100px 98px; }
  .ring { fill: none; stroke: #1d8bff; stroke-width: 3; opacity: 0; transform-origin: center; }
  [data-state="listening"] .ring { animation: pulse 1.4s ease-out infinite; }
  [data-state="speaking"] .mouth { animation: talk .25s ease-in-out infinite alternate; }
  [data-state="thinking"] .eye { animation: blink 1s ease-in-out infinite; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.25); } }
  @keyframes talk { from { transform: scaleY(.4); } to { transform: scaleY(1.5); } }
  @keyframes blink { 50% { opacity: .2; } }
  .wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 44px; margin-top: 4px; }
  .wave i { display: block; width: 4px; height: 6px; border-radius: 3px; background: #1d8bff; opacity: .55; transition: height .15s; }
  [data-state="listening"] .wave i, [data-state="speaking"] .wave i { animation: bar .9s ease-in-out infinite; opacity: 1; }
  @keyframes bar { 0%,100% { height: 6px; } 50% { height: 38px; } }
  .chat {
    flex: 1 1 auto; overflow-y: auto; margin: 8px -4px 0; padding: 4px;
    display: flex; flex-direction: column; gap: 8px; z-index: 1;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; font-size: .97rem; word-wrap: break-word; }
  .msg.bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 6px; box-shadow: 0 3px 10px rgba(10,60,160,.12); }
  .msg.user { align-self: flex-end; background: #1d6fd8; color: #fff; border-bottom-right-radius: 6px; }
  .msg.interim { opacity: .65; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; z-index: 1; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 0; border-radius: 999px; padding: 9px 14px; font-size: .88rem; cursor: pointer;
    background: rgba(255,255,255,.9); color: #1d6fd8; box-shadow: 0 3px 10px rgba(10,60,160,.15);
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; z-index: 1; }
  .bar input {
    flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: 14px 18px; font-size: 1rem; font-family: inherit;
    background: rgba(255,255,255,.95); color: #0a2a6b; outline: none; box-shadow: 0 3px 10px rgba(10,60,160,.15);
  }
  .mic {
    flex: 0 0 auto; width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
    background: linear-gradient(145deg, #3aa0ff, #0a5fe0); box-shadow: 0 8px 22px rgba(10,95,224,.45);
    display: flex; align-items: center; justify-content: center; transition: transform .1s;
  }
  .mic:active { transform: scale(.94); }
  .mic.on { background: linear-gradient(145deg, #ff6b6b, #e02a2a); box-shadow: 0 8px 22px rgba(224,42,42,.45); }
  .mic svg { width: 28px; height: 28px; fill: currentColor; }
  .send { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; color: #1d6fd8; font-size: 1.2rem; cursor: pointer; box-shadow: 0 3px 10px rgba(10,60,160,.15); }
  .note { font-size: .72rem; text-align: center; color: #2f5fb3; padding-bottom: 6px; z-index: 1; }
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">
  <div class="glow"></div>

  <header>
    <div>
      <h1 id="title">Trợ lý AI</h1>
      <div class="status" id="status">Sẵn sàng</div>
    </div>
    <button class="icon-btn" id="btnSound" title="Bật/tắt giọng đọc" aria-label="Bật/tắt giọng đọc">🔊</button>
  </header>

  <section class="stage">
    <svg class="robot" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring" cx="100" cy="95" r="82"/>
      <circle class="ring" cx="100" cy="95" r="82" style="animation-delay:.7s"/>
      <rect x="30" y="68" width="22" height="46" rx="11" fill="#1d6fd8"/>
      <rect x="148" y="68" width="22" height="46" rx="11" fill="#1d6fd8"/>
      <path d="M44 78 C44 30 156 30 156 78" fill="none" stroke="#1d6fd8" stroke-width="8" stroke-linecap="round"/>
      <path d="M156 100 Q160 128 126 132" fill="none" stroke="#1d6fd8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="122" cy="132" r="5" fill="#1d6fd8"/>
      <rect x="48" y="48" width="104" height="84" rx="34" fill="#fff"/>
      <rect x="58" y="60" width="84" height="58" rx="24" fill="#0b2a73"/>
      <path class="eye" d="M76 88 Q84 76 92 88"/>
      <path class="eye" d="M108 88 Q116 76 124 88"/>
      <path class="mouth" d="M90 100 Q100 110 110 100"/>
      <rect x="72" y="138" width="56" height="44" rx="20" fill="#fff"/>
      <circle cx="100" cy="160" r="11" fill="#1d6fd8"/>
      <path d="M95 160 a5 5 0 1 1 5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="wave" id="wave"></div>
  </section>

  <main class="chat" id="chat" aria-live="polite"></main>

  <div class="chips" id="chips"></div>

  <form class="bar" id="form" autocomplete="off">
    <input id="text" type="text" placeholder="Nhập tin nhắn hoặc bấm micro để nói..." enterkeyhint="send">
    <button type="submit" class="send" aria-label="Gửi">➤</button>
    <button type="button" class="mic" id="btnMic" aria-label="Nói chuyện">
      <svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg>
    </button>
  </form>
  <div class="note" id="note"></div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var cfg = window.ASSISTANT_CONFIG;
  var app = document.getElementById('app');
  var chat = document.getElementById('chat');
  var statusEl = document.getElementById('status');
  var textEl = document.getElementById('text');
  var micBtn = document.getElementById('btnMic');
  var soundBtn = document.getElementById('btnSound');
  var chipsEl = document.getElementById('chips');
  var noteEl = document.getElementById('note');
  var interimEl = null;
  var recog = null;
  var soundOn = localStorage.getItem('assistant.sound') !== '0';
  var voice = null;

  document.getElementById('title').textContent = cfg.name;
  document.title = cfg.name;

  var wave = document.getElementById('wave');
  for (var i = 0; i < 21; i++) {
    var b = document.createElement('i');
    b.style.animationDelay = (i * 0.07 % 0.9).toFixed(2) + 's';
    wave.appendChild(b);
  }

  var STATUS = { idle: 'Sẵn sàng', listening: 'Đang nghe bạn nói...', thinking: 'Đang suy nghĩ...', speaking: 'Đang trả lời...' };
  function setState(s) { app.dataset.state = s; statusEl.textContent = STATUS[s]; micBtn.classList.toggle('on', s === 'listening'); }

  function addMsg(who, text, cls) {
    var d = document.createElement('div');
    d.className = 'msg ' + who + (cls ? ' ' + cls : '');
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function localReply(msg) {
    var n = ' ' + norm(msg) + ' ';
    for (var i = 0; i < cfg.faq.length; i++) {
      for (var j = 0; j < cfg.faq[i].keys.length; j++) {
        if (n.indexOf(' ' + cfg.faq[i].keys[j] + ' ') !== -1) return cfg.faq[i].reply;
      }
    }
    return cfg.fallback;
  }

  function getReply(msg) {
    if (!cfg.apiEndpoint) return Promise.resolve(localReply(msg));
    return fetch(cfg.apiEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { return j.reply || cfg.fallback; })
      .catch(function () { return localReply(msg); });
  }

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var vs = speechSynthesis.getVoices();
    voice = vs.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('vi') === 0; })[0] || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  function speak(text) {
    if (!soundOn || !('speechSynthesis' in window)) { setState('idle'); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = cfg.speechLang;
    if (voice) u.voice = voice;
    u.onstart = function () { setState('speaking'); };
    u.onend = u.onerror = function () { setState('idle'); };
    setState('speaking');
    speechSynthesis.speak(u);
  }

  function say(text) { addMsg('bot', text); speak(text); }

  function handleUser(msg) {
    msg = (msg || '').trim();
    if (!msg) return;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    addMsg('user', msg);
    setState('thinking');
    getReply(msg).then(say);
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.style.opacity = .4;
    noteEl.textContent = 'Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome (Android) hoặc nhập tin nhắn.';
  }

  function startListening() {
    if (!SR) { noteEl.textContent = 'Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy nhập tin nhắn.'; return; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    recog = new SR();
    recog.lang = cfg.speechLang;
    recog.interimResults = true;
    recog.continuous = false;
    var finalText = '';
    recog.onstart = function () { noteEl.textContent = ''; setState('listening'); };
    recog.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
      }
      var shown = finalText + interim;
      if (!interimEl) interimEl = addMsg('user', shown, 'interim'); else interimEl.textContent = shown;
      chat.scrollTop = chat.scrollHeight;
    };
    recog.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') noteEl.textContent = 'Bạn cần cho phép truy cập micro để nói chuyện.';
      else if (e.error === 'no-speech') noteEl.textContent = 'Mình không nghe thấy gì, bạn thử lại nhé.';
      else if (e.error !== 'aborted') noteEl.textContent = 'Lỗi micro: ' + e.error;
    };
    recog.onend = function () {
      if (interimEl) { interimEl.remove(); interimEl = null; }
      recog = null;
      if (finalText.trim()) handleUser(finalText); else setState('idle');
    };
    try { recog.start(); } catch (err) {}
  }

  micBtn.addEventListener('click', function () {
    if (recog) recog.stop(); else startListening();
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = textEl.value;
    textEl.value = '';
    handleUser(v);
  });

  soundBtn.classList.toggle('off', !soundOn);
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    localStorage.setItem('assistant.sound', soundOn ? '1' : '0');
    soundBtn.classList.toggle('off', !soundOn);
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    if (!soundOn && 'speechSynthesis' in window) { speechSynthesis.cancel(); setState('idle'); }
  });

  cfg.suggestions.forEach(function (s) {
    var c = document.createElement('button');
    c.type = 'button'; c.className = 'chip'; c.textContent = s;
    c.addEventListener('click', function () { handleUser(s); });
    chipsEl.appendChild(c);
  });

  addMsg('bot', cfg.greeting);
  setState('idle');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
